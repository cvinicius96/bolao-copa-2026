<!DOCTYPE html>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070d07;--card:#0d1f0d;--card2:#111f11;--border:#1a3a1a;
  --gold:#FFD700;--orange:#FFA500;--green:#006400;--green2:#00cc66;
  --text:#e8f0e8;--muted:#6a8a6a;--red:#ff4444;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Roboto',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:60px;}

/* HEADER */
.header{background:linear-gradient(90deg,#001a00,var(--green),#001a00);padding:14px 16px;border-bottom:3px solid var(--gold);display:flex;align-items:center;justify-content:center;gap:10px;position:sticky;top:0;z-index:100;}
.header h1{font-family:'Bebas Neue',cursive;font-size:1.4rem;color:var(--gold);letter-spacing:2px;}

/* LOGIN */
#loginBox{max-width:400px;margin:40px auto;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px 24px;}
#loginBox h2{font-family:'Bebas Neue',cursive;color:var(--gold);font-size:1.6rem;letter-spacing:2px;text-align:center;margin-bottom:6px;}
#loginBox p{color:var(--muted);font-size:.82rem;text-align:center;margin-bottom:22px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:.76rem;color:var(--muted);margin-bottom:5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;}
.field input, .field select{width:100%;padding:12px 14px;border-radius:8px;border:1px solid var(--border);background:#0a1a0a;color:var(--text);font-size:.95rem;outline:none;}
.field input:focus,.field select:focus{border-color:var(--gold);}
.btn-gold{width:100%;background:linear-gradient(135deg,var(--gold),var(--orange));color:#000;border:none;border-radius:8px;padding:13px;font-family:'Bebas Neue',cursive;font-size:1.1rem;letter-spacing:2px;cursor:pointer;margin-top:6px;}
.btn-gold:hover{opacity:.9;}
.err{color:var(--red);font-size:.8rem;text-align:center;margin-top:10px;display:none;}

/* PROGRESSO */
#progressoBar{display:none;background:#0a1a0a;border-bottom:1px solid var(--border);padding:10px 16px;}
.prog-info{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.prog-nome{font-weight:700;font-size:.88rem;color:var(--gold);}
.prog-count{font-family:'Bebas Neue',cursive;font-size:1.1rem;}
.prog-track{height:8px;background:var(--border);border-radius:4px;overflow:hidden;}
.prog-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--green2),var(--gold));transition:width .4s;}

/* FORMULÁRIO */
#formBox{display:none;max-width:600px;margin:0 auto;padding:12px 12px 80px;}

.grupo-header{font-family:'Bebas Neue',cursive;font-size:1rem;color:var(--gold);letter-spacing:3px;padding:10px 12px 6px;margin-top:8px;border-bottom:1px solid var(--border);}

.jogo-card{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;}
.jogo-top{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 6px;}
.jogo-num{font-size:.68rem;color:var(--muted);letter-spacing:1px;}
.jogo-data{font-size:.68rem;color:var(--muted);}
.jogo-times{display:flex;align-items:center;justify-content:center;gap:6px;padding:0 12px 10px;font-weight:700;font-size:.92rem;}
.jogo-sep{color:var(--muted);font-size:.8rem;}

/* BOTÕES DE APOSTA */
.aposta-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;border-top:1px solid var(--border);}
.ap-btn{padding:11px 4px;text-align:center;cursor:pointer;font-size:.75rem;font-weight:700;border:none;background:transparent;color:#666;transition:all .2s;border-right:1px solid var(--border);}
.ap-btn:last-child{border-right:none;}
.ap-btn:hover{background:rgba(255,255,255,.04);}
.ap-btn.sel-A{background:rgba(0,180,80,.25);color:#00dd00;}
.ap-btn.sel-E{background:rgba(255,215,0,.2);color:var(--gold);}
.ap-btn.sel-B{background:rgba(0,100,200,.25);color:#66aaff;}
.ap-btn .emoji{font-size:1rem;display:block;margin-bottom:2px;}

/* BOTÃO SALVAR FIXO */
#btnSalvarFixed{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(135deg,var(--gold),var(--orange));color:#000;border:none;padding:16px;font-family:'Bebas Neue',cursive;font-size:1.2rem;letter-spacing:2px;cursor:pointer;z-index:200;display:none;box-shadow:0 -4px 20px rgba(0,0,0,.5);}

/* TOAST */
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#002200;border:1px solid var(--gold);color:var(--gold);padding:10px 20px;border-radius:8px;font-size:.85rem;font-weight:700;display:none;z-index:999;white-space:nowrap;}
#toast.err{background:#220000;border-color:var(--red);color:var(--red);}
#toast.info{background:#001122;border-color:#4488ff;color:#88aaff;}

/* LOADING */
#loading{display:none;text-align:center;padding:40px 20px;color:var(--muted);font-size:.9rem;}
.spinner{width:36px;height:36px;border:3px solid rgba(255,215,0,.15);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg)}}

/* CONCLUÍDO */
#concluido{display:none;max-width:400px;margin:40px auto;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px 24px;text-align:center;}
#concluido h2{font-family:'Bebas Neue',cursive;color:var(--green2);font-size:1.8rem;letter-spacing:2px;margin-bottom:10px;}
#concluido p{color:var(--muted);font-size:.88rem;line-height:1.7;}

/* MOBILE */
@media(max-width:380px){
  .jogo-times{font-size:.82rem;}
  .ap-btn{font-size:.7rem;padding:9px 2px;}
}
</style>
</head>

  <span style="font-size:1.4rem;">⚽</span>

<!-- LOGIN -->

// =============================================
// ESTADO
// =============================================
let apostador=null;
let palpites={};// {jogoId: 'A'|'E'|'B'}

function toast(msg,tipo='ok'){
  const t=document.getElementById('toast');
  t.className=tipo==='err'?'err':tipo==='info'?'info':'';
  t.textContent=msg;t.style.display='block';
  clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3000);
}
function atualizarProgresso(){
  const feitos=Object.keys(palpites).length;
  const pct=Math.round(feitos/72*100);
  document.getElementById('progCount').textContent=feitos+'/72';
  document.getElementById('progFill').style.width=pct+'%';
  document.getElementById('progCount').style.color=pct===100?'#00dd00':pct>=50?'#FFD700':'#ff8844';
}

// =============================================
// LOGIN
// =============================================
document.getElementById('btnEntrar').addEventListener('click', async()=>{
  const nome=document.getElementById('inputNome').value.trim();
  const senha=document.getElementById('inputSenha').value.trim();
  const errEl=document.getElementById('loginErr');
  errEl.style.display='none';
  if(!nome||!senha){errEl.textContent='Preencha nome e senha.';errEl.style.display='block';return;}

  document.getElementById('loginBox').style.display='none';
  document.getElementById('loading').style.display='block';

  try{
    // Carregar config (data fechamento)
    const cfg=await getDoc(doc(db,'config','bolao'));
    if(cfg.exists()&&cfg.data().dataFinal){
      DATA_FINAL=new Date(cfg.data().dataFinal+'T23:59:59');
    }

    // Verificar manutenção
    const man=await getDoc(doc(db,'config','manutencao'));
    if(man.exists()&&man.data().ativo){
      document.getElementById('loading').style.display='none';
      document.getElementById('loginBox').style.display='block';
      errEl.textContent='Sistema em manutenção. Tente novamente em breve.';
      errEl.style.display='block';
      return;
    }

    // Verificar prazo
    if(new Date()>DATA_FINAL){
      document.getElementById('loading').style.display='none';
      document.getElementById('loginBox').style.display='block';
      errEl.textContent='Prazo encerrado. Apostas não são mais aceitas.';
      errEl.style.display='block';
      return;
    }

    // Buscar apostadores
    const snap=await getDocs(collection(db,'apostadores'));
    const apostadores=snap.docs.map(d=>({id:d.id,...d.data()}));
    const ap=apostadores.find(a=>a.nome.toLowerCase()===nome.toLowerCase());
    if(!ap){
      document.getElementById('loading').style.display='none';
      document.getElementById('loginBox').style.display='block';
      errEl.textContent='Nome não encontrado. Verifique com o administrador.';
      errEl.style.display='block';
      return;
    }
    const senhaEsperada=(ap.senha&&ap.senha.trim())?ap.senha.trim():'2026';
    if(senha!==senhaEsperada){
      document.getElementById('loading').style.display='none';
      document.getElementById('loginBox').style.display='block';
      errEl.textContent='Senha incorreta.';
      errEl.style.display='block';
      return;
    }

    apostador=ap;

    // Carregar apostas existentes
    const apostasDoc=await getDoc(doc(db,'apostas',ap.id));
    if(apostasDoc.exists()&&apostasDoc.data().votos){
      palpites={...apostasDoc.data().votos};
    }

    document.getElementById('loading').style.display='none';
    iniciarFormulario();

  }catch(e){
    document.getElementById('loading').style.display='none';
    document.getElementById('loginBox').style.display='block';
    errEl.textContent='Erro de conexão. Verifique sua internet.';
    errEl.style.display='block';
    console.error(e);
  }
});

// =============================================
// FORMULÁRIO
// =============================================
function iniciarFormulario(){
  const progBar=document.getElementById('progressoBar');
  const formBox=document.getElementById('formBox');
  const btnSalvar=document.getElementById('btnSalvarFixed');

  document.getElementById('progNome').textContent=apostador.nome;
  progBar.style.display='block';
  formBox.style.display='block';
  btnSalvar.style.display='block';
  atualizarProgresso();

  GRUPOS.forEach(g=>{
    const ghdr=document.createElement('div');
    ghdr.className='grupo-header';
    ghdr.textContent='GRUPO '+g;
    formBox.appendChild(ghdr);

    JOGOS.filter(j=>j.g===g).forEach((j,idx)=>{
      const card=document.createElement('div');
      card.className='jogo-card';
      card.id='jogo-'+j.id;

      const top=document.createElement('div');
      top.className='jogo-top';
      top.innerHTML=`<span class="jogo-num">JOGO ${j.id}</span><span class="jogo-data">📅 ${j.d} • ${j.h}</span>`;
      card.appendChild(top);

      const times=document.createElement('div');
      times.className='jogo-times';
      times.innerHTML=`<span>${j.a}</span><span class="jogo-sep">×</span><span>${j.b}</span>`;
      card.appendChild(times);

      const btns=document.createElement('div');
      btns.className='aposta-btns';

      const ops=[
        {val:'A',emoji:'🏆',label:j.a.length>10?j.a.substring(0,9)+'…':j.a},
        {val:'E',emoji:'🤝',label:'Empate'},
        {val:'B',emoji:'🏆',label:j.b.length>10?j.b.substring(0,9)+'…':j.b},
      ];

      ops.forEach(op=>{
        const btn=document.createElement('button');
        btn.className='ap-btn'+(palpites[j.id]===op.val?' sel-'+op.val:'');
        btn.innerHTML=`<span class="emoji">${op.emoji}</span>${op.label}`;
        btn.addEventListener('click',()=>{
          palpites[j.id]=op.val;
          // Atualizar visual dos 3 botões deste jogo
          btns.querySelectorAll('.ap-btn').forEach((b,i)=>{
            b.className='ap-btn'+(palpites[j.id]===ops[i].val?' sel-'+ops[i].val:'');
          });
          atualizarProgresso();
          // Rolar para o próximo jogo
          const cards=formBox.querySelectorAll('.jogo-card');
          const current=Array.from(cards).findIndex(c=>c.id==='jogo-'+j.id);
          if(current>=0&&current<cards.length-1){
            setTimeout(()=>cards[current+1].scrollIntoView({behavior:'smooth',block:'center'}),150);
          }
        });
        btns.appendChild(btn);
      });

      card.appendChild(btns);
      formBox.appendChild(card);
    });
  });

  // Botão salvar
  btnSalvar.addEventListener('click', salvarApostas);
}

// =============================================
// SALVAR
// =============================================
async function salvarApostas(){
  const feitos=Object.keys(palpites).length;
  if(feitos===0){toast('Faça pelo menos 1 palpite antes de salvar!','err');return;}

  // Verificar prazo novamente
  if(new Date()>DATA_FINAL){toast('Prazo encerrado! Apostas não aceitas.','err');return;}

  const btn=document.getElementById('btnSalvarFixed');
  btn.textContent='⏳ SALVANDO...';btn.disabled=true;

  try{
    await setDoc(doc(db,'apostas',apostador.id),{votos:palpites},{merge:true});
    btn.textContent='💾 SALVAR APOSTAS';btn.disabled=false;

    // Mostrar tela de conclusão
    document.getElementById('progressoBar').style.display='none';
    document.getElementById('formBox').style.display='none';
    btn.style.display='none';

    const total=Object.keys(palpites).length;
    const faltam=72-total;
    document.getElementById('concluidoMsg').innerHTML=
      `<strong style="color:#00dd00;">${total} palpite${total>1?'s':''}</strong> salvos com sucesso!`
      +(faltam>0?`<br><span style="color:#FFD700;">Ainda faltam ${faltam} jogo${faltam>1?'s':''}.</span><br>Volte para completar!`:'<br><span style="color:#00dd00;">Todos os 72 jogos apostados! Boa sorte! 🏆</span>');
    document.getElementById('concluido').style.display='block';

  }catch(e){
    btn.textContent='💾 SALVAR APOSTAS';btn.disabled=false;
    toast('Erro ao salvar. Verifique sua conexão.','err');
    console.error(e);
  }
}

document.getElementById('inputNome').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('inputSenha').focus();});
